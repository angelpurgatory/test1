<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARG-SITE</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071c2f, #0f3b5f 60%, #1d7aa5);
      color: #f5f5f5;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      max-width: 760px;
      width: 100%;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }
    h1 { margin-top: 0; font-size: 2rem; }
    p { line-height: 1.6; }
    a { color: #8fe3ff; }
  </style>
</head>
<body>
  <main class="card">
    <h1>ARG-SITE</h1>
    <p>This site has been published to GitHub Pages from the current project folder.</p>
    <p>It includes the main landing page content and is ready to be viewed online.</p>
    <p>If you want, I can next help you wire up the rest of the original pages and assets into this published version.</p>
  </main>
</body>
</html>
